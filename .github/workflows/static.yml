# Сборка и публикация приложения на GitHub Pages
name: Deploy to GitHub Pages

on:
  # Каждый пуш в main публикует новую версию
  push:
    branches: ["main"]

  # Ручной запуск из вкладки Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одна публикация за раз; уже идущую не отменяем
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build
        # base_path — «/social-net» для сайта проекта; медиа берутся из public/media
        run: npx tsc && npx vite build --base "${{ steps.pages.outputs.base_path }}/"
        env:
          VITE_LOCAL_MEDIA: "1"
      - name: SPA fallback
        # Pages отдаёт 404.html на неизвестные пути — так открываются прямые ссылки вроде /chats/ch-u1
        run: cp dist/index.html dist/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
